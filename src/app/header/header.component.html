<header class="app-header">
  <div class="header-inner">
    <a class="brand" routerLink="/home">SearchiTunes</a>
    <nav class="main-nav">
      <a routerLink="/home" routerLinkActive="active" class="nav-link-with-icon">
        <fa-icon icon="house" />
        {{ 'nav.home' | translate }}
      </a>
      <a routerLink="/search" routerLinkActive="active" class="nav-link-with-icon">
        <fa-icon icon="magnifying-glass" />
        {{ 'nav.search' | translate }}
      </a>
      <a routerLink="/shopping-cart" routerLinkActive="active" class="nav-link-with-icon cart-link">
        <fa-icon icon="cart-shopping" />
        {{ 'nav.cart' | translate }}
        <span class="cart-count">{{ cartCount$ | async }}</span>
      </a>
      <div class="lang-switcher" aria-label="Language">
        <fa-icon icon="globe" class="lang-icon" />
        <select
          class="lang-select"
          [value]="languageService.currentLang()"
          (change)="setLanguage($any($event.target).value)"
          aria-label="Select language"
        >
          @for (lang of languageService.languages; track lang) {
            <option [value]="lang">{{ lang | uppercase }}</option>
          }
        </select>
      </div>
    </nav>
  </div>
</header>
