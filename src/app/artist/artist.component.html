@if (artist$ | async; as artist) {
  <div class="row mt-3">
    <div class="col-12 col-lg-8 mx-auto">
      <h2 class="fw-normal">
        Artist: {{ artist.artistName }}
        <span class="badge text-bg-secondary">{{ artist.primaryGenreName }}</span>
      </h2>
      <hr />
      <ul class="nav nav-pills mb-3">
        <li class="nav-item">
          <a class="nav-link" routerLink="songs" routerLinkActive="active">Songs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="albums" routerLinkActive="active">Albums</a>
        </li>
      </ul>
      <router-outlet />
    </div>
  </div>
}
