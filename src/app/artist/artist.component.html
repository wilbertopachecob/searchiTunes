@if (artist$ | async; as artist) {
  <section class="page-section">
    <header class="section-header">
      <h1>{{ artist.artistName }}</h1>
      <p>{{ artist.primaryGenreName }}</p>
    </header>
    <div class="artist-tabs">
      <a class="btn btn-outline-dark btn-sm" routerLink="songs" routerLinkActive="active">Songs</a>
      <a class="btn btn-outline-dark btn-sm" routerLink="albums" routerLinkActive="active">Albums</a>
    </div>
    <router-outlet />
  </section>
}
