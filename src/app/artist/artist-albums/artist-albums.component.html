<div class="table-responsive">
  <table class="table app-table">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Artwork</th>
        <th scope="col">Name</th>
        <th scope="col">Price</th>
        <th scope="col"></th>
      </tr>
    </thead>
    <tbody>
      @for (album of albums$ | async; track album.id; let i = $index) {
        <tr>
          <th scope="row">{{ i + 1 }}</th>
          <td><img [src]="album.artworkUrl" [alt]="album.title" width="48" height="48" class="rounded-2" /></td>
          <td>{{ album.title }}</td>
          <td>{{ album.currency }} {{ album.price.toFixed(2) }}</td>
          <td>
            <button type="button" class="btn btn-sm btn-dark" (click)="addToCart(album)">Add to Cart</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
