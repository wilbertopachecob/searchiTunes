<div class="col-12 col-md-8 col-lg-6 mx-auto my-4">
  <form [formGroup]="form">
    <div class="mb-3">
      <input
        type="text"
        class="form-control form-control-lg"
        placeholder="Search artists, songs, or albums..."
        formControlName="search"
      />
    </div>
  </form>

  @if (loading) {
    <p class="text-muted">Loading...</p>
  }

  <div class="list-group">
    @for (item of searchItems$ | async; track item.artistId + item.trackName) {
      <a
        class="list-group-item list-group-item-action d-flex gap-3 align-items-start"
        [routerLink]="['/artist', item.artistId]"
      >
        <img [src]="item.artworkUrl60" [alt]="item.trackName" width="60" height="60" />
        <div class="flex-grow-1">
          <div class="fw-semibold">{{ item.trackName }}</div>
          <audio
            controls
            preload="none"
            class="mt-2 w-100"
            #audio
            (play)="stopAll(audio)"
            (click)="$event.stopPropagation()"
          >
            <source [src]="item.previewUrl" type="audio/mp4" />
          </audio>
        </div>
      </a>
    }
  </div>
</div>
