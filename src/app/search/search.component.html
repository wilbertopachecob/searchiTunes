<section class="page-section">
  <div class="section-header">
    <h1>Find music and add to cart</h1>
    <p>Search tracks, preview snippets, and buy songs from one place.</p>
  </div>

  <form [formGroup]="form" class="search-form">
    <input
      type="text"
      class="search-input"
      placeholder="Search artists or songs..."
      formControlName="search"
    />
  </form>

  @if (loading) {
    <p class="state-note">Searching iTunes...</p>
  }

  <div class="item-grid">
    @for (item of searchItems$ | async; track item.id) {
      <article class="item-card">
        <img class="cover" [src]="item.artworkUrl" [alt]="item.trackName" width="90" height="90" />
        <div class="content">
          <a class="title-link" [routerLink]="['/artist', item.artistId]">{{ item.trackName }}</a>
          <p class="subtitle">{{ item.artistName }}</p>
          <p class="price">{{ item.currency }} {{ item.trackPrice.toFixed(2) }}</p>
          <audio controls preload="none" #audio (play)="stopAll(audio)">
            <source [src]="item.previewUrl" type="audio/mp4" />
          </audio>
        </div>
        <button type="button" class="btn btn-dark btn-sm" (click)="addToCart(item)" [disabled]="isInCart(item)">
          {{ isInCart(item) ? 'Added' : 'Add to Cart' }}
        </button>
      </article>
    }
  </div>
</section>
