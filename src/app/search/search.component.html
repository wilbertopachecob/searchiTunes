<section class="page-section">
  <div class="section-header">
    <h1>{{ 'search.title' | translate }}</h1>
    <p>{{ 'search.subtitle' | translate }}</p>
  </div>

  <form [formGroup]="form" class="search-form">
    <input
      type="text"
      class="search-input"
      [placeholder]="'search.placeholder' | translate"
      formControlName="search"
    />
  </form>

  <app-loading-state
    [loading]="loading"
    [message]="'search.loading' | translate"
    [skeletonCount]="3"
  />

  <div class="item-grid">
    @for (item of searchItems$ | async; track item.id) {
      <article class="item-card">
        <img class="cover" [src]="item.artworkUrl" [alt]="item.trackName" width="90" height="90" />
        <div class="content">
          <a class="title-link" [routerLink]="['/artist', item.artistId]">{{ item.trackName }}</a>
          <p class="subtitle">{{ item.artistName }}</p>
          <p class="price">{{ item.currency }} {{ item.trackPrice.toFixed(2) }}</p>
          <audio controls preload="none" #audio (play)="stopAll(audio)">
            <source [src]="item.previewUrl" type="audio/mp4" />
          </audio>
        </div>
        <button
          type="button"
          class="btn btn-dark btn-sm btn-with-icon"
          (click)="addToCart(item)"
          [disabled]="isInCart(item)"
        >
          <fa-icon [icon]="isInCart(item) ? 'cart-shopping' : 'cart-plus'" />
          {{ (isInCart(item) ? 'search.added' : 'search.addToCart') | translate }}
        </button>
      </article>
    }
  </div>
</section>
